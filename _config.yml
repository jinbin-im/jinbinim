# Site settings
title: Jinbin Im
email: your-email@hanyang.ac.kr
description: Ph.D. Candidate in Construction Management at Hanyang University
baseurl: ""
url: "https://jinbin-im.github.io"

# Social Links
google_scholar: https://scholar.google.com/citations?user=fBEZousAAAAJ
cv_link: /assets/pdf/CV_JinbinIm.pdf
github: https://github.com/jinbin-im
semantic_scholar: https://www.semanticscholar.org/author/Jin-bin-Im/2166382817
linkedin: https://www.linkedin.com/in/jin-bin-im-5aa3b2343/
orcid: https://orcid.org/0000-0003-1672-5439

# Build settings
markdown: kramdown
permalink: /:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-scholar

# Jekyll Scholar Configuration
scholar:
  style: apa
  locale: en
  source: ./_bibliography
  bibliography: papers.bib
  bibliography_template: papers
  sort_by: year
  order: descending
  
  # Author highlighting
  last_name: [Im]
  first_name: [Jin-Bin, J.-B., J. B., J.B.]
  
  # Group by year
  group_by: year
  group_order: descending

  bibliography_list_tag: div
  bibliography_item_tag: div

# Collections
collections:
  pages:
    output: true
    permalink: /:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Navigation
navigation:
  - title: About
    url: /
  - title: Publications
    url: /#publications
  - title: Conferences
    url: /#conferences

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - README.md
  - LICENSE
